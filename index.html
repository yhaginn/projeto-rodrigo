<!DOCTYPE html> <html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0"

<title>GTA VI | V.O.X</title>

<style>

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body { min-height: 100vh;

display: flex; align-items: center; justify-content: center;

overflow: hidden;

font-family: Arial, Helvetica, sans-serif;

color: white;

background: radial-gradient( circle at 20% 30%, rgba(255, 23, 68, .25), transparent 30% ),

radial-gradient( circle at 80% 70%, rgba(255, 109, 0, .25), transparent 30% ),

linear-gradient( 135deg, #080808, #19070b, #080808 ); }

/* FUNDO */

.background { position: fixed;

inset: 0;

overflow: hidden;

z-index: -1; }

.circle { position: absolute;

border-radius: 50%;

filter: blur(5px);

opacity: .3;

animation: move 8s infinite alternate ease-in-out; }

.circle.one { width: 300px; height: 300px;

top: -100px; left: -100px;

background: #ff1744; }

.circle.two { width: 250px; height: 250px;

bottom: -80px; right: -80px;

background: #ff6d00;

animation-delay: 2s; }

.circle.three { width: 150px; height: 150px;

top: 50%; right: 20%;

background: #ffd600;

animation-delay: 4s; }

@keyframes move {

from { transform: translate(0, 0); }

to { transform: translate(80px, -50px); }

}

/* CONTEÚDO */

.container { width: 90%;

max-width: 1100px;

text-align: center;

padding: 40px; }

/* LOGO */

.vox { color: #ffd600;

font-size: 18px;

font-weight: 900;

letter-spacing: 6px;

margin-bottom: 35px; }

/* TEXTO */

.incoming { color: #ff6d00;

font-size: 15px;

font-weight: bold;

letter-spacing: 5px;

margin-bottom: 15px;

animation: blink 2s infinite; }

@keyframes blink {

0%, 100% { opacity: 1; }

50% { opacity: .45; }

}

h1 { font-size: clamp( 55px, 10vw, 130px );

line-height: .85;

font-weight: 1000;

letter-spacing: -7px;

text-transform: uppercase;

background: linear-gradient( 135deg, #ff1744, #ff6d00, #ffd600 );

-webkit-background-clip: text;

-webkit-text-fill-color: transparent;

filter: drop-shadow( 0 0 25px rgba(255, 23, 68, .3) );

margin-bottom: 30px; }

.subtitle { max-width: 650px;

margin: auto;

color: #c2c2ca;

font-size: 18px;

line-height: 1.7; }

/* CONTAGEM */

.countdown { display: flex;

justify-content: center;

gap: 15px;

margin: 40px 0; }

.time { min-width: 100px;

padding: 20px 15px;

border-radius: 15px;

background: rgba( 255, 255, 255, .05 );

border: 1px solid #34343d;

backdrop-filter: blur(10px);

transition: .3s; }

.time:hover { transform: translateY(-6px);

border-color: #ff1744;

box-shadow: 0 0 25px rgba(255, 23, 68, .2); }

.time strong { display: block;

font-size: 35px;

color: #ffd600; }

.time span { color: #888;

font-size: 11px;

letter-spacing: 2px; }

/* BOTÕES */

.buttons { display: flex;

justify-content: center;

gap: 12px;

flex-wrap: wrap; }

.button { padding: 15px 25px;

border-radius: 10px;

border: none;

font-size: 14px;

font-weight: bold;

text-decoration: none;

cursor: pointer;

transition: .3s; }

.button:hover { transform: translateY(-4px); }

.primary { color: white;

background: linear-gradient( 135deg, #ff1744, #ff6d00 );

box-shadow: 0 10px 30px rgba(255, 23, 68, .25); }

.secondary { color: white;

background: #17171e;

border: 1px solid #383840; }

.secondary:hover { border-color: #ffd600;

color: #ffd600; }

/* MENSAGEM */

#message { min-height: 25px;

margin-top: 25px;

color: #ffd600;

font-weight: bold; }

/* RESPONSIVO */

@media (max-width: 600px) {

.container { padding: 20px; }

h1 { font-size: 58px;

letter-spacing: -4px; }

.subtitle { font-size: 15px; }

.countdown { gap: 7px; }

.time { min-width: 70px;

padding: 14px 8px; }

.time strong { font-size: 24px; }

.time span { font-size: 8px; }

}

</style>

</head>

<body>

<!-- FUNDO -->

<div class="background">

<div class="circle one"></div>

<div class="circle two"></div>

<div class="circle three"></div>

</div>

<!-- CONTEÚDO -->

<main class="container">

<div class="vox"> V.O.X </div>

<div class="incoming"> ⚠️ SOMETHING BIG IS COMING ⚠️ </div>

<h1> GTA VI<br> IS INCOMING!! </h1>

<p class="subtitle">

Prepare-se para a próxima grande aventura. <br>

<strong> Grand Theft Auto VI </strong>

está chegando.

</p>

<!-- CONTADOR -->

<div class="countdown">

<div class="time">

<strong id="days"> 00 </strong>

<span> DIAS </span>

</div>

<div class="time">

<strong id="hours"> 00 </strong>

<span> HORAS </span>

</div>

<div class="time">

<strong id="minutes"> 00 </strong>

<span> MINUTOS </span>

</div>

<div class="time">

<strong id="seconds"> 00 </strong>

<span> SEGUNDOS </span>

</div>

</div>

<!-- BOTÕES -->

<div class="buttons">

<button class="button primary" id="notifyButton" > 🔔 Quero ser avisado </button>

<button class="button secondary" id="trailerButton" > ▶ Ver trailer </button>

<a href="index.html" class="button secondary" > ← Voltar para V.O.X </a>

</div>

<div id="message"></div>

</main>

<script>

/* ========================= CONTADOR ========================= */

/* Data de lançamento definida para a demonstração. */

const launchDate = new Date("2027-05-26T00:00:00").getTime();

function updateCountdown() {

const now = new Date().getTime();

const distance = launchDate - now;

if (distance <= 0) {

document.getElementById("days") .textContent = "00";

document.getElementById("hours") .textContent = "00";

document.getElementById("minutes") .textContent = "00";

document.getElementById("seconds") .textContent = "00";

return;

}

const days = Math.floor( distance / (1000 * 60 * 60 * 24) );

const hours = Math.floor( (distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60) );

const minutes = Math.floor( (distance % (1000 * 60 * 60)) / (1000 * 60) );

const seconds = Math.floor( (distance % (1000 * 60)) / 1000 );

document.getElementById("days") .textContent = String(days).padStart(2, "0");

document.getElementById("hours") .textContent = String(hours).padStart(2, "0");

document.getElementById("minutes") .textContent = String(minutes).padStart(2, "0");

document.getElementById("seconds") .textContent = String(seconds).padStart(2, "0");

}

updateCountdown();

setInterval( updateCountdown, 1000 );

/* ========================= BOTÃO DE NOTIFICAÇÃO ========================= */

document .getElementById("notifyButton") .addEventListener( "click", function () {

document .getElementById("message") .textContent = "🔔 Você será avisado quando houver novidades!";

this.textContent = "✓ Notificações ativadas";

this.style.background = "#00a86b";

} );

/* ========================= TRAILER ========================= */

document .getElementById("trailerButton") .addEventListener( "click", function () {

window.open( "https://www.youtube.com/results?searchquery=GTA+VI+trailer", "blank" );

} );

</script>

</body>

</html>
